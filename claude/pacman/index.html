<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pac-Man</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <a class="back" href="../">&larr; All games</a>

      <header class="hud">
        <h1>Pac-Man</h1>
        <dl class="stats">
          <div class="stat">
            <dt>Score</dt>
            <dd id="score">0</dd>
          </div>
          <div class="stat">
            <dt>Best</dt>
            <dd id="best">0</dd>
          </div>
          <div class="stat">
            <dt>Level</dt>
            <dd id="level">1</dd>
          </div>
        </dl>
      </header>

      <canvas id="board" aria-label="Pac-Man maze"></canvas>
      <p id="announcer" class="visually-hidden" aria-live="polite"></p>

      <footer class="controls">
        <p class="keys">
          <span><kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> / <kbd>WASD</kbd> steer</span> ·
          <span><kbd>Enter</kbd> start</span> ·
          <span><kbd>P</kbd>/<kbd>Esc</kbd> pause</span> ·
          <span><kbd>R</kbd> restart</span>
        </p>
      </footer>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
